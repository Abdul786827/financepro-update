name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install required Android platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1"

      - name: Read Gradle version from wrapper properties
        id: gv
        run: |
          FILE=gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found in repo"
            exit 1
          fi
          VER=$(grep distributionUrl "$FILE" | sed -E 's/.*gradle-([0-9][0-9.]*)-(bin|all)\.zip.*/\1/')
          echo "Detected Gradle version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancePro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
