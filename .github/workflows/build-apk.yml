name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Read Gradle version from wrapper properties
        id: gv
        run: |
          FILE=gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found in repo"
            exit 1
          fi
          VER=$(grep distributionUrl "$FILE" | sed -E 's/.*gradle-([0-9][0-9.]*)-(bin|all)\.zip.*/\1/')
          echo "Detected Gradle version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancePro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error